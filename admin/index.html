<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13142B">
<meta name="robots" content="noindex, nofollow">
<title>Панель клуба</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#13142B; --bg-2:#181A36; --panel:#1C1E3D; --panel-2:#24274D; --line:#30346A; --line-2:#3E4380;
  --text:#ECEDFB; --muted:#9A9ECB; --dim:#6B6F9E;
  --std:#3ED3E6; --vip:#F4B740; --boot:#FF5C93; --console:#8C7CFF; --other:#5BE39B;
  --ok:#5BE39B; --warn:#F4B740; --bad:#FF5C6C;
  --accent:var(--std);
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#13142B; --text:#ECEDFB; } }
:root[data-theme="dark"]{ --bg:#13142B; --text:#ECEDFB; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 85% -10%, rgba(62,211,230,.10), transparent 60%),radial-gradient(900px 500px at -10% 30%, rgba(140,124,255,.10), transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(19,20,43,.85);backdrop-filter:blur(14px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(19,20,43,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo i{width:12px;height:12px;border-radius:3px;background:var(--std);box-shadow:0 0 14px var(--std);display:inline-block}
.top .grow{flex:1}
.shift-pill{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.shift-pill b{color:var(--text);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* hero */
.hero{padding:44px 0 28px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1.02;margin:0 0 12px;letter-spacing:-.01em}
.hero p.lead{color:var(--muted);font-size:18px;max-width:58ch;margin:0 0 28px}
.strips{display:grid;gap:14px}
.strip{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) auto;align-items:center;gap:18px;background:linear-gradient(90deg,var(--panel),rgba(28,30,61,.4));border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;text-align:left;width:100%;transition:border-color .2s, transform .2s}
.strip:hover{border-color:var(--zc)}
.strip .zname{font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
.strip .zname small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.leds{display:flex;flex-wrap:wrap;gap:5px}
.led{width:14px;height:10px;border-radius:2px;background:#2A2D57}
.led.on{background:var(--zc);box-shadow:0 0 8px var(--zc)}
.led.rep{background:repeating-linear-gradient(45deg,#3a2a3a 0 3px,#2A2D57 3px 6px)}
.strip .cnt{font-family:var(--display);font-weight:700;font-size:22px;white-space:nowrap}
.strip .cnt small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
@media (max-width:640px){.strip{grid-template-columns:minmax(0,1fr) auto}.strip .leds{grid-column:1/-1;order:3}}

/* sections */
section.block{padding:30px 0}
h2.h{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 22px}

/* booking */
.book{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media (max-width:960px){.book{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.field-label{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:all .15s}
.chip small{font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--bg-2));box-shadow:0 0 0 1px var(--accent) inset}
.chip .sw{width:10px;height:10px;border-radius:3px}
.date-chip{flex-direction:column;gap:0;min-width:64px;padding:8px 10px;line-height:1.2}
.date-chip b{font-size:18px;font-family:var(--display)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.mt{margin-top:18px}
select,input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
.stepper{display:flex;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{background:none;border:0;width:44px;height:44px;font-size:20px;font-weight:700;color:var(--muted)}
.stepper button:hover{color:var(--text);background:var(--panel-2)}
.stepper output{flex:1;text-align:center;font-weight:800;font-size:16px}

/* seat map */
.map{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;overflow-x:auto}
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.seats{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,5),minmax(54px,1fr));min-width:max-content}
.seat{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:700}
.seat .scr{width:100%;min-width:54px;aspect-ratio:16/10;border-radius:7px;border:1.5px solid var(--zc);background:color-mix(in srgb,var(--zc) 10%,transparent);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--text);transition:all .15s}
.seat .stand{width:30%;height:4px;border-radius:2px;background:var(--line-2)}
.seat.free:hover .scr{background:color-mix(in srgb,var(--zc) 28%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--zc) 60%,transparent)}
.seat.sel .scr{background:var(--zc);color:#14152E;box-shadow:0 0 18px var(--zc)}
.seat.busy .scr{border-color:var(--line);background:repeating-linear-gradient(135deg,#22254a 0 6px,#1d1f40 6px 12px);color:var(--dim)}
.seat.rep .scr{border-color:#5a3346;background:#26172a;color:#a0607a}
.seat.busy,.seat.rep{cursor:not-allowed}
.admin .seat.busy,.admin .seat.rep{cursor:pointer}
.seat .who{position:absolute;top:-6px;right:-6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;font-size:10px;padding:0 4px;color:var(--text)}
.zone-specs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.spec{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}

/* summary */
.summary{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.sum-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum-line span:first-child{color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0}
.total b{font-family:var(--display);font-size:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:15px;background:var(--accent);color:#14152E;transition:filter .15s, transform .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.block{width:100%}
.btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.sel-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.sel-list span{background:var(--bg-2);border:1px solid var(--accent);border-radius:7px;padding:2px 8px;font-size:13px;font-weight:700}

/* zones info */
.zones-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.zcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden}
.zcard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--zc);box-shadow:0 0 16px var(--zc)}
.zcard h3{font-family:var(--display);font-size:18px;margin:4px 0 6px}
.zcard .price{font-size:26px;font-weight:800;font-family:var(--display);margin:12px 0 2px}
.zcard .price small{font-size:13px;font-family:var(--body);color:var(--muted);font-weight:600}

/* my bookings */
.mine{display:grid;gap:10px}
.mine .item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,9,24,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.code{font-family:var(--display);font-size:40px;letter-spacing:.06em;text-align:center;margin:10px 0;color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent) 60%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 18px;z-index:60;font-weight:700;box-shadow:0 10px 40px rgba(0,0,0,.4)}

/* ===== ADMIN ===== */
.admin-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 64px - env(safe-area-inset-top,0px));overflow:auto}
.side button{background:none;border:0;text-align:left;padding:11px 14px;border-radius:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:10px}
.side button svg{width:18px;height:18px;flex:none}
.side button:hover{background:var(--panel);color:var(--text)}
.side button[aria-current="page"]{background:var(--panel-2);color:var(--text);box-shadow:inset 3px 0 0 var(--std)}
.side .sp{flex:1}
.main{padding:24px 26px 60px;min-width:0}
@media (max-width:860px){
  .admin-shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:rgba(19,20,43,.92);backdrop-filter:blur(12px);z-index:15;padding:8px}
  .side button{white-space:nowrap;padding:9px 12px}
  .side .sp{display:none}
  .main{padding:18px 14px 60px}
}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-family:var(--display);font-size:26px;margin:0}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:none;border:0;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.kpi span{font-size:13px;color:var(--muted);font-weight:700}
.kpi b{display:block;font-family:var(--display);font-size:26px;margin-top:4px;white-space:nowrap}
.kpi small{font-size:12.5px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{width:100%;height:240px;display:block}
.chart text{fill:var(--dim);font-size:11px;font-family:var(--body)}
.bar-row{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.bar-row .track{height:10px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.bar-row .fill{height:100%;border-radius:5px}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:11px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
td select{padding:6px 8px;border-radius:8px;font-size:13px;width:auto}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters>*,.filters input[type=date],.filters select{width:auto}
.filters input[type=text]{min-width:220px;flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* shifts */
.week{display:grid;grid-template-columns:110px repeat(7,minmax(118px,1fr));gap:8px;min-width:960px}
.week .hd{font-size:13px;font-weight:700;color:var(--muted);padding:6px 4px}
.week .hd b{display:block;color:var(--text);font-family:var(--display);font-size:16px}
.week .hd.today b{color:var(--std)}
.week .lbl{font-size:13px;font-weight:700;color:var(--muted);padding:10px 4px;display:flex;flex-direction:column;justify-content:center}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:62px;display:flex;flex-direction:column;gap:6px}
.slot.today{border-color:color-mix(in srgb,var(--std) 60%,var(--line))}
.slot select{padding:7px 8px;font-size:13px;border-radius:9px}
.slot .who{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.staff-list{display:grid;gap:8px}
.staff{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#14152E;flex:none}
.staff .grow{flex:1;min-width:0}
.staff small{color:var(--muted);display:block}

/* zones edit */
.zedit{display:grid;gap:14px}
.zrow{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--zc);border-radius:var(--r-md);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.zrow label{font-size:12.5px;font-weight:700;color:var(--muted);display:grid;gap:6px}
.zrow .wide{grid-column:span 2}
@media (max-width:520px){.zrow .wide{grid-column:auto}}
.zrow input[type=color]{width:100%;height:44px;padding:4px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}

/* hall popover */
.seat-pop h4{font-family:var(--display);margin:0 0 6px;font-size:20px}
.pop-actions{display:grid;gap:8px;margin-top:14px}
.login{max-width:380px;margin:12vh auto;padding:0 20px}
.login .card{padding:28px}
.login h2{font-family:var(--display);margin:0 0 6px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.note{font-size:13px;color:var(--muted);background:var(--bg-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px}

.banner{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:var(--r-md);padding:14px 16px;margin:16px 0}
.skeleton{opacity:.5;pointer-events:none}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap" style="max-width:none">
    <span class="logo"><i></i><span id="clubName">Панель клуба</span></span>
    <div class="grow"></div>
    <span class="live-tag hidden" id="liveTag"><span class="dot live"></span>онлайн</span>
  </div>
</header>

<div id="loginView" class="hidden">
  <div class="login">
    <div class="card">
      <h2>Панель клуба</h2>
      <p class="muted" style="margin:0 0 18px">Вход для администраторов.</p>
      <label class="field-label" for="email">Email</label>
      <input type="text" id="email" autocomplete="username" inputmode="email">
      <label class="field-label mt" for="pass">Пароль</label>
      <input type="password" id="pass" autocomplete="current-password">
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn block mt" id="loginBtn" type="button">Войти</button>
    </div>
  </div>
</div>

<div id="msgView" class="hidden"><div class="login"><div class="card"><h2 id="msgTitle"></h2><p class="muted" id="msgText"></p><button class="btn ghost block mt hidden" id="msgLogout" type="button">Выйти</button></div></div></div>

<div id="admin" class="admin hidden">
  <div class="admin-shell">
    <nav class="side" id="side" aria-label="Разделы">

    <div class="legend"><span><i style="border:1.5px solid var(--std)"></i>свободно</span><span><i style="background:repeating-linear-gradient(135deg,#2a2d57 0 3px,#1d1f40 3px 6px)"></i>занято</span><span><i style="background:#26172a;border:1px solid #5a3346"></i>обслуживание</span></div></div>
    ${S.zones.map(z=>`<div class="map mt" style="--zc:${z.color}"><div class="map-head"><b>${esc(z.name)}</b><span class="muted">свободно ${freeNow(z).length} из ${z.seats}</span></div>
      <div class="seats" style="--cols:${z.cols}">${seatIds(z).map(id=>{const s=seatState(id,now,now+60e3);const tag=s.b?esc(s.b.name.split(" ")[0]):"";
        return `<button type="button" class="seat ${s.st}" data-hseat="${id}" style="--zc:${z.color}" aria-label="Место ${seatNum(id)}"><span class="scr">${seatNum(id)}</span><span class="stand"></span>${tag?`<span class="who">${tag}</span>`:""}</button>`}).join("")}</div></div>`).join("")||`<div class="card empty">Добавьте зоны в разделе «Зоны и цены».</div>`}`;
  m.onclick=hallClick;
}
function hallClick(e){
  const btn=e.target.closest("[data-hseat]");if(!btn)return;const id=btn.dataset.hseat;const z=zoneById(zoneOfSeat(id));const n=seatNum(id);const now=Date.now();const s=seatState(id,now,now+60e3);
  let info="";
  if(s.b) info=`<p>Бронь <b>${esc(s.b.code)}</b>: ${esc(s.b.name)}${s.b.phone?", "+esc(s.b.phone):""}<br>${hm(s.b.start)}–${hm(bEnd(s.b))}, ${money(s.b.total)}</p>`;
  else if(s.st==="rep") info=`<p>На обслуживании${s.m.note?`: ${esc(s.m.note)}`:""}</p>`;
  else{const nb=S.bookings.filter(x=>isActive(x)&&x.seats.includes(id)&&x.start>now).sort((a,c)=>a.start-c.start)[0];info=`<p class="muted">Свободно. Ближайшая бронь: ${nb?`${dLabel(nb.start)} в ${hm(nb.start)}, ${esc(nb.name)}`:"нет"}</p>`}
  openModal(`<div class="seat-pop"><h4>${esc(z.name)}, место ${n}</h4>${info}
    <div class="pop-actions">
      ${s.st==="free"?`<div class="row"><select id="mHours" aria-label="На сколько часов">${[1,2,3,4,5,6,8,12].map(h=>`<option value="${h}">${h} ч</option>`).join("")}</select><button class="btn" type="button" data-act="walkin">Посадить гостя без брони</button></div>
        <input type="text" id="mNote" placeholder="Имя гостя (необязательно)" maxlength="40">`:""}
      ${s.b&&s.b.status==="booked"?`<button class="btn" type="button" data-act="arrived">Гость пришёл</button>`:""}
      ${s.b?`<button class="btn ghost" type="button" data-act="finish">Завершить сейчас</button>`:""}
      ${s.st==="rep"?`<button class="btn" type="button" data-act="unrepair">Вернуть в работу</button>`:s.st==="free"?`<input type="text" id="mRep" placeholder="Причина обслуживания, например «меняем мышь»" maxlength="60"><button class="btn danger" type="button" data-act="repair">На обслуживание</button>`:""}
      <button class="btn ghost" type="button" data-close>Закрыть</button></div></div>`,
  mm=>mm.addEventListener("click",async ev=>{const a=ev.target.closest("[data-act]");if(!a||a.disabled)return;a.disabled=true;const act0=a.dataset.act;let ok=false;
    if(act0==="walkin"){const h=+$("#mHours").value;const start=Date.now();const name=$("#mNote").value.trim()||"Гость без брони";
      ok=await act(sb.from("club_bookings").insert(toRow({code:mkCode(),name,phone:"",zoneId:z.id,seats:[id],start,hours:h,total:calcPrice(z,start,h,1,priceClub()).total,status:"arrived",source:"walkin",comment:"Посажен с карты зала"})),"Гость посажен");}
    if(act0==="arrived") ok=await act(sb.from("club_bookings").update({status:"arrived"}).eq("id",s.b.id),"Отмечено: гость пришёл");
    if(act0==="finish"){const b=s.b;const used=Math.min(b.hours,Math.max(1,Math.ceil((Date.now()-b.start)/HOUR)));
      if(b.seats.length>1){const rest=b.seats.filter(x=>x!==id);
        const r1=await sb.from("club_bookings").update({seats:rest.map(seatNum),total:calcPrice(z,b.start,b.hours,rest.length,priceClub()).total}).eq("id",b.id);
        if(r1.error){toast(errText(r1.error))}else ok=await act(sb.from("club_bookings").insert(toRow({...b,code:mkCode(),seats:[id],hours:used,total:calcPrice(z,b.start,used,1,priceClub()).total,status:"done"})),"Сеанс на месте завершён");}
      else ok=await act(sb.from("club_bookings").update({hours:used,total:calcPrice(z,b.start,used,1,priceClub()).total,status:"done"}).eq("id",b.id),`Сеанс завершён, ${used} ч`);}
    if(act0==="repair") ok=await act(sb.from("club_repairs").insert({zone_id:z.id,seat:n,note:$("#mRep").value.trim()}),"Место отправлено на обслуживание");
    if(act0==="unrepair") ok=await act(sb.from("club_repairs").delete().eq("zone_id",z.id).eq("seat",n),"Место снова в работе");
    if(ok) closeModal(); else a.disabled=false;}));
}

  else if(A.bDate==="tomorrow")list=list.filter(b=>b.start>=today+DAY&&b.start<today+2*DAY);
  else if(A.bDate==="upcoming")list=list.filter(b=>isActive(b)||(b.start>=Date.now()&&statusOf(b)!=="cancelled"));
  else if(A.bDate==="week")list=list.filter(b=>b.start>=today-6*DAY&&b.start<today+DAY);

  const asc=["today","tomorrow","upcoming"].includes(A.bDate);list.sort((a,b)=>asc?a.start-b.start:b.start-a.start);
  const sum=list.filter(countsRevenue).reduce((a,b)=>a+b.total,0);
  const src={site:"сайт",admin:"админ",walkin:"без брони"};
  m.innerHTML=`<div class="page-head"><div><h2>Брони</h2><div class="muted">${list.length} ${plural(list.length,"бронь","брони","броней")}, в выручку идёт ${money(sum)}</div></div><button class="btn" type="button" id="newB">Новая бронь</button></div>
  <div class="filters">
    <div class="seg" role="group" aria-label="Период">${[["today","Сегодня"],["tomorrow","Завтра"],["upcoming","Предстоящие"],["week","7 дней"],["all","Последние 2 месяца"]].map(([k,n])=>`<button type="button" data-bd="${k}" aria-pressed="${A.bDate===k}">${n}</button>`).join("")}</div>
    <input type="date" id="bDay" value="${/^\d{4}-/.test(A.bDate)?A.bDate:""}" aria-label="Конкретный день">
    <select id="bZone" aria-label="Зона"><option value="all">Все зоны</option>${S.allZones.map(z=>`<option value="${z.id}" ${A.bZone===z.id?"selected":""}>${esc(z.name)}${z.active?"":" (удалена)"}</option>`).join("")}</select>
    <select id="bStatus" aria-label="Статус"><option value="all">Все статусы</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${A.bStatus===k?"selected":""}>${v.n}</option>`).join("")}</select>
    <input type="text" id="bQ" placeholder="Поиск: имя, телефон или код" value="${esc(A.q)}">
  </div>
  ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Когда</th><th>Гость</th><th>Зона и места</th><th>Часы</th><th>Сумма</th><th>Код</th><th>Оформлена</th><th>Статус</th></tr></thead><tbody>
  ${list.slice(0,300).map(b=>{const z=zoneById(b.zoneId);const st=statusOf(b);return `<tr><td>${dLabel(b.start)}<br><b>${hm(b.start)}–${hm(bEnd(b))}</b></td>
    <td><b>${esc(b.name)}</b><br><span class="muted">${b.phone?`<a href="tel:${esc(b.phone.replace(/[^\d+]/g,""))}" style="color:var(--muted)">${esc(b.phone)}</a>`:"—"}</span></td>
    <td><span class="badge"><i style="background:${z?z.color:"#888"}"></i>${esc(z?z.name:"удалена")}</span><br><span class="muted">${b.seats.length} шт.: ${b.seats.map(seatNum).join(", ")}</span></td>
    <td>${b.hours} ч</td><td class="num"><b>${money(b.total)}</b></td><td><b>${esc(b.code)}</b></td>
    <td class="muted">${dLabel(b.createdAt)}, ${hm(b.createdAt)}<br>${src[b.source]||esc(b.source)}</td>
    <td><select data-st="${b.id}" aria-label="Статус брони ${esc(b.code)}" style="border-color:${STATUS[st].c}">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${st===k?"selected":""}>${v.n}</option>`).join("")}</select></td></tr>`}).join("")}
  </tbody></table></div>${list.length>300?`<p class="muted">Показаны первые 300. Уточните фильтр.</p>`:""}`:`<div class="card empty">Броней с такими условиями нет.</div>`}`;
  $$("[data-bd]",m).forEach(b=>b.addEventListener("click",()=>{A.bDate=b.dataset.bd;render()}));
  $("#bDay").addEventListener("change",e=>{A.bDate=e.target.value||"today";render()});
  $("#bZone").addEventListener("change",e=>{A.bZone=e.target.value;render()});
  $("#bStatus").addEventListener("change",e=>{A.bStatus=e.target.value;render()});

function newBookingModal(){
  const n=new Date();const mins=Math.ceil((n.getHours()*60+n.getMinutes())/30)*30;
  openModal(`<h3 style="font-family:var(--display);margin:0 0 14px">Новая бронь</h3>
    <label class="field-label">Имя гостя</label><input type="text" id="nbName" maxlength="40">
    <label class="field-label mt">Телефон</label><input type="tel" id="nbPhone" value="+7 " maxlength="20">
    <div class="row mt"><div><label class="field-label">Зона</label><select id="nbZone">${S.zones.map(z=>`<option value="${z.id}">${esc(z.name)}</option>`).join("")}</select></div>
    <div><label class="field-label">Мест</label><input type="number" id="nbCount" value="1" min="1" max="200"></div></div>
    <div class="row mt"><div><label class="field-label">Дата</label><input type="date" id="nbDate" value="${dayKey(Date.now()+(mins>=1440?DAY:0))}"></div>
    <div><label class="field-label">Начало</label><input type="text" id="nbTime" value="${pad(Math.floor(mins/60)%24)}:${pad(mins%60)}" placeholder="18:30"></div>
    <div><label class="field-label">Часов</label><input type="number" id="nbHours" value="2" min="1" max="24"></div></div>
    <label class="field-label mt">Комментарий</label><input type="text" id="nbComment" maxlength="200" placeholder="Например, день рождения">
    <div class="err" id="nbErr"></div><p class="muted" style="font-size:13px" id="nbInfo"></p>
    <div class="row mt"><button class="btn ghost" data-close type="button">Отмена</button><button class="btn" id="nbSave" type="button">Сохранить бронь</button></div>`,
  mm=>{
    const calc=()=>{const z=zoneById($("#nbZone").value);if(!z)return null;const dk=$("#nbDate").value;const tm=$("#nbTime").value.trim().match(/^(\d{1,2}):(\d{2})$/);
      if(!dk||!tm||+tm[1]>23||+tm[2]>59)return null;const start=keyToTs(dk)+(+tm[1])*HOUR+(+tm[2])*60e3;const hours=Math.max(1,Math.min(24,+$("#nbHours").value||1));const cnt=Math.max(1,+$("#nbCount").value||1);
      const free=seatIds(z).filter(id=>seatState(id,start,start+hours*HOUR).st==="free");return {z,start,hours,cnt,free,price:calcPrice(z,start,hours,cnt,priceClub()).total}};
    const upd=()=>{const c=calc();$("#nbInfo").textContent=c?`Свободно ${c.free.length} из ${c.z.seats} на это время, сумма ${money(c.price)}`:"Проверьте дату и время."};
    mm.addEventListener("input",upd);upd();
    $("#nbSave").addEventListener("click",async()=>{const c=calc();const name=$("#nbName").value.trim();const err=$("#nbErr");err.textContent="";
      if(!c){err.textContent="Время в формате 18:30.";return} if(name.length<2){err.textContent="Укажите имя гостя.";return}
      if(c.free.length<c.cnt){err.textContent=`На это время свободно только ${c.free.length} ${plural(c.free.length,"место","места","мест")}.`;return}
      $("#nbSave").disabled=true;
      const ok=await act(sb.from("club_bookings").insert(toRow({code:mkCode(),name,phone:normPhone($("#nbPhone").value)||"",zoneId:c.z.id,seats:c.free.slice(0,c.cnt),start:c.start,hours:c.hours,total:c.price,status:"booked",source:"admin",comment:$("#nbComment").value.trim()})),"Бронь сохранена");
      if(ok)closeModal();else $("#nbSave").disabled=false});
  });
}

/* ---- shifts ---- */
function aShifts(m){
  const today=dayStart(Date.now());
  if(A.weekStart===null){const wd=(new Date(today).getDay()+6)%7;A.weekStart=today-wd*DAY}
  const days=Array.from({length:7},(_,i)=>dayStart(A.weekStart+i*DAY+3*HOUR));
  const opt=sel=>`<option value="">не назначен</option>`+S.allStaff.filter(s=>s.active||s.id===sel).map(s=>`<option value="${s.id}" ${sel===s.id?"selected":""}>${esc(s.name)}</option>`).join("");
  const cell=(t,part)=>{const k=dayKey(t);const sid=S.shifts[k]&&S.shifts[k][part];const s=S.allStaff.find(x=>x.id===sid);
    return `<div class="slot ${t===today?"today":""}">${s?`<div class="who"><span class="dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}"></span>${esc(s.name)}</div>`:`<div class="who muted">Никого</div>`}<select data-shift="${k}|${part}" aria-label="${part==="day"?"Дневная":"Ночная"} смена ${k}">${opt(sid)}</select></div>`};
  const cnt={};days.forEach(t=>{const v=S.shifts[dayKey(t)];if(v)["day","night"].forEach(p=>{if(v[p])cnt[v[p]]=(cnt[v[p]]||0)+1})});
  const sh=shiftNow();
  m.innerHTML=`<div class="page-head"><div><h2>Смены</h2><div class="muted">Сейчас на смене: <b style="color:var(--text)">${sh?esc(sh.name):"никто не назначен"}</b>. Это имя видят гости на сайте.</div></div>
    <div class="seg"><button type="button" id="wPrev" aria-label="Прошлая неделя">‹</button><button type="button" id="wNow">Эта неделя</button><button type="button" id="wNext" aria-label="Следующая неделя">›</button></div></div>
  <div class="map" style="padding:14px"><div class="week">
    <div></div>${days.map(t=>{const d=new Date(t);return `<div class="hd ${t===today?"today":""}">${WD[d.getDay()]}<b>${d.getDate()} ${MON[d.getMonth()]}</b></div>`}).join("")}
    <div class="lbl">День<span class="muted" style="font-weight:500">08:00–20:00</span></div>${days.map(t=>cell(t,"day")).join("")}
    <div class="lbl">Ночь<span class="muted" style="font-weight:500">20:00–08:00</span></div>${days.map(t=>cell(t,"night")).join("")}
  </div></div>
  <div class="row mt"><button class="btn ghost sm" type="button" id="copyWeek" style="flex:none">Скопировать эту неделю на следующую</button></div>
  <div class="grid2 mt">
    <div><h3 style="font-family:var(--display);font-size:18px;margin:10px 0 12px">Сотрудники</h3><div class="staff-list">${S.staff.map(s=>`<div class="staff"><div class="ava" style="background:${s.color}">${esc(s.name[0]||"?")}</div><div class="grow"><b>${esc(s.name)}</b><small>${esc(s.phone||"без телефона")}, ${cnt[s.id]||0} ${plural(cnt[s.id]||0,"смена","смены","смен")} на этой неделе</small></div><button class="btn danger sm" type="button" data-del-staff="${s.id}">Удалить</button></div>`).join("")||`<div class="empty">Добавьте первого сотрудника.</div>`}</div></div>
    <div class="card" style="align-self:start"><b>Добавить сотрудника</b>
      <label class="field-label mt" for="stName">Имя</label><input type="text" id="stName" placeholder="Например, Дана" maxlength="30">
      <label class="field-label mt" for="stPhone">Телефон</label><input type="tel" id="stPhone" placeholder="+7 7__ ___ __ __" maxlength="20">
      <div class="err" id="stErr"></div><button class="btn block mt" type="button" id="stAdd">Добавить</button></div>
  </div>`;
  $$("[data-shift]",m).forEach(s=>s.addEventListener("change",()=>{const [k,p]=s.dataset.shift.split("|");s.disabled=true;
    act(sb.from("club_shifts").upsert({day:k,part:p,staff_id:s.value||null}),"Смена сохранена")}));
  $("#wPrev").onclick=()=>{A.weekStart-=7*DAY;render()};$("#wNext").onclick=()=>{A.weekStart+=7*DAY;render()};$("#wNow").onclick=()=>{A.weekStart=null;render()};
  $("#copyWeek").onclick=async()=>{const rows=[];days.forEach(t=>{const src=S.shifts[dayKey(t)];if(src)["day","night"].forEach(p=>{if(src[p]!==undefined)rows.push({day:dayKey(dayStart(t+7*DAY+3*HOUR)),part:p,staff_id:src[p]||null})})});
    if(!rows.length){toast("На этой неделе нет смен для копирования");return}
    if(await act(sb.from("club_shifts").upsert(rows),"Скопировано на следующую неделю")){A.weekStart+=7*DAY;render()}};
  $("#stAdd").onclick=async()=>{const n=$("#stName").value.trim();if(n.length<2){$("#stErr").textContent="Укажите имя.";return}
    const pal=["#3ED3E6","#FF5C93","#F4B740","#8C7CFF","#5BE39B","#FF9F43","#62A8FF"];
    $("#stAdd").disabled=true;await act(sb.from("club_staff").insert({name:n,phone:normPhone($("#stPhone").value)||"",color:pal[S.allStaff.length%pal.length]}),`${n}: добавлен(а)`)};
  $$("[data-del-staff]",m).forEach(b=>b.addEventListener("click",()=>{const s=S.staff.find(x=>x.id===b.dataset.delStaff);
    confirmModal(`Удалить ${s.name}?`,"Сотрудник пропадёт из списка для новых смен. Прошлые смены и выручка по ним сохранятся.","Удалить",()=>act(sb.from("club_staff").update({active:false}).eq("id",s.id),"Сотрудник удалён"))}));
}

/* ---- zones & prices ---- */
function aZones(m){
  m.innerHTML=`<div class="page-head"><div><h2>Зоны и цены</h2><div class="muted">Изменения сохраняются сразу и видны гостям на сайте.</div></div><button class="btn" type="button" id="zAdd">Добавить зону</button></div>
  <div class="zedit">${S.zones.map(z=>`<div class="zrow" style="--zc:${z.color}" data-z="${z.id}">
    <label class="wide">Название<input type="text" data-f="name" value="${esc(z.name)}" maxlength="30"></label>
    <label>Тип<select data-f="kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${z.kind===k?"selected":""}>${v.n}</option>`).join("")}</select></label>
    <label>Мест (ПК)<input type="number" data-f="seats" min="1" max="200" value="${z.seats}"></label>
    <label>В ряду на карте<input type="number" data-f="cols" min="1" max="12" value="${z.cols}"></label>
    <label>Цена днём, ₸/час<input type="number" data-f="price" min="0" step="50" value="${z.price}"></label>
    <label>Цена ночью, ₸/час<input type="number" data-f="night" min="0" step="50" value="${z.night}"></label>
    <label>Порядок на сайте<input type="number" data-f="sort" min="0" max="999" value="${z.sort}"></label>
    <label>Цвет<input type="color" data-f="color" value="${z.color}"></label>
    <label class="wide" style="grid-column:1/-1">Характеристики (через запятую, гости видят под картой)<input type="text" data-f="specs" value="${esc(z.specs)}" maxlength="200"></label>
    <div style="grid-column:1/-1;display:flex;justify-content:flex-end"><button class="btn danger sm" type="button" data-zdel="${z.id}">Удалить зону</button></div></div>`).join("")||`<div class="card empty">Зон пока нет. Добавьте первую.</div>`}</div>
  <div class="grid2 mt">
    <div class="card"><b>Клуб</b>
      <div class="row mt"><div><label class="field-label">Название</label><input type="text" id="cfName" value="${esc(S.club.name)}" maxlength="40"></div><div><label class="field-label">Телефон</label><input type="tel" id="cfPhone" value="${esc(S.club.phone)}" maxlength="20"></div></div>
      <div class="row mt"><div><label class="field-label">Адрес</label><input type="text" id="cfAddr" value="${esc(S.club.address)}" maxlength="80"></div><div><label class="field-label">Часы работы</label><input type="text" id="cfHours" value="${esc(S.club.hours)}" maxlength="40"></div></div>
      <div class="row mt"><div><label class="field-label">Ночной тариф с (час)</label><input type="number" id="cfNf" min="0" max="23" value="${S.club.nightFrom}"></div><div><label class="field-label">до (час)</label><input type="number" id="cfNt" min="0" max="23" value="${S.club.nightTo}"></div><div><label class="field-label">Бронь вперёд, дней</label><input type="number" id="cfDays" min="1" max="14" value="${S.club.maxDays}"></div></div>
      <button class="btn mt" type="button" id="cfSave">Сохранить настройки клуба</button></div>
    <div class="card" style="align-self:start"><b>Ваш аккаунт</b><p class="muted" style="font-size:14px">${esc(me.email)}</p>
      <label class="field-label" for="np">Новый пароль</label><input type="password" id="np" autocomplete="new-password" placeholder="Минимум 8 символов">
      <button class="btn ghost sm mt" type="button" id="npSave">Сменить пароль</button>
      <p class="note mt">Новых администраторов добавляет владелец в Supabase (инструкция в README).</p></div>
  </div>`;
  m.querySelectorAll(".zrow").forEach(row=>row.addEventListener("change",async e=>{const f=e.target.dataset.f;if(!f)return;const z=zoneById(row.dataset.z);let v=e.target.value;
    if(["seats","cols","price","night","sort"].includes(f)){v=Math.round(+v||0);v=Math.max(["price","night","sort"].includes(f)?0:1,v);if(f==="cols")v=Math.min(12,v);if(f==="seats")v=Math.min(200,v)}
    if(f==="name"&&!String(v).trim()){e.target.value=z.name;return}
    if(f==="seats"&&v<z.seats){const cut=seatIds(z).slice(v);const fut=S.bookings.filter(b=>b.zoneId===z.id&&isActive(b)&&b.seats.some(s=>cut.includes(s)));
      if(fut.length){toast(`Нельзя: на места ${cut.map(seatNum).join(", ")} есть активные брони (${fut.length})`);e.target.value=z.seats;return}
      const rep=cut.filter(s=>S.manual[s]);if(rep.length){const r=await sb.from("club_repairs").delete().eq("zone_id",z.id).gt("seat",v);if(r.error){toast(errText(r.error));return}}}
    e.target.blur();await act(sb.from("club_zones").update({[f]:v}).eq("id",z.id),"Сохранено")}));
  $$("[data-zdel]",m).forEach(b=>b.addEventListener("click",()=>{const z=zoneById(b.dataset.zdel);const fut=S.bookings.filter(x=>x.zoneId===z.id&&isActive(x)).length;
    if(fut){toast(`У зоны ${fut} активных броней. Сначала отмените или завершите их.`);return}
    confirmModal(`Удалить зону «${z.name}»?`,"Гости перестанут её видеть. Прошлые брони останутся в отчётах.","Удалить",()=>act(sb.from("club_zones").update({active:false}).eq("id",z.id),"Зона удалена"))}));
  $("#zAdd").onclick=async()=>{const id="z"+Math.random().toString(36).slice(2,8).replace(/[^a-z0-9]/g,"x");const sort=Math.max(0,...S.allZones.map(z=>z.sort))+1;
    await act(sb.from("club_zones").insert({id,name:"Новая зона",kind:"other",color:KIND.other.c,seats:4,cols:4,price:1000,night:800,specs:"",sort}),"Зона добавлена внизу списка")};
  $("#cfSave").onclick=()=>act(sb.from("club_settings").update({name:$("#cfName").value.trim()||S.club.name,phone:$("#cfPhone").value.trim(),address:$("#cfAddr").value.trim(),hours:$("#cfHours").value.trim(),
      night_from:Math.min(23,Math.max(0,+$("#cfNf").value|0)),night_to:Math.min(23,Math.max(0,+$("#cfNt").value|0)),max_days_ahead:Math.min(14,Math.max(1,+$("#cfDays").value|0)),updated_at:new Date().toISOString()}).eq("id",1),"Настройки клуба сохранены");
  $("#npSave").onclick=async()=>{const p=$("#np").value;if(p.length<8){toast("Пароль минимум 8 символов");return}const {error}=await sb.auth.updateUser({password:p});if(error){toast(errText(error));return}$("#np").value="";toast("Пароль изменён")};
}

/* ---------- bind ---------- */
$("#loginBtn").addEventListener("click",login);
["#email","#pass"].forEach(s=>$(s).addEventListener("keydown",e=>{if(e.key==="Enter")login()}));
$("#msgLogout").addEventListener("click",logout);
$("#logout").addEventListener("click",logout);
$("#toSite").addEventListener("click",()=>window.open("../","_blank"));
$("#side").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;A.tab=b.dataset.tab;render();window.scrollTo(0,0)});
boot();
})();
</script>
</body>
</html>
